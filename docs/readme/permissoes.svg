<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" role="img" aria-labelledby="title desc">
  <title id="title">Permissoes</title>
  <desc id="desc">Em Ajustes do Sistema, Privacidade e Seguranca, ligue Prism em Acessibilidade e em Monitoramento de Entrada.</desc>
  <defs>
    <style>
      .card { fill: #F6F3EC; stroke: #E3DDD2; }
      .kicker { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8A837A; letter-spacing: 0.04em; }
      .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1C1B19; }
      .sub { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6A645C; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="428" height="175" rx="18" class="card"/>
  <circle cx="44" cy="44" r="22" fill="#E8F0FC"/>
  <g transform="translate(33, 28)" fill="none" stroke="#3B6FD4" stroke-width="1.8" stroke-linecap="round">
    <circle cx="11" cy="8" r="5"/>
    <path d="M2 32 C2 22 20 22 20 32"/>
    <path d="M0 18 H8 M14 18 H22"/>
  </g>
  <text x="80" y="36" class="kicker">AJUSTES  &#183;  PRIVACIDADE E SEGURAN&#199;A</text>
  <text x="80" y="60" class="title">Acessibilidade</text>
  <text x="28" y="108" class="sub">&#201; o que deixa o Prism ler e trocar o</text>
  <text x="28" y="128" class="sub">texto do campo em que voc&#234; digita.</text>
  <text x="28" y="152" class="sub">Procure Prism na lista e ligue.</text>

  <rect x="452.5" y="0.5" width="427" height="175" rx="18" class="card"/>
  <circle cx="496" cy="44" r="22" fill="#F8EDE3"/>
  <g transform="translate(476, 30)" fill="none" stroke="#C46A2D" stroke-width="1.5" stroke-linejoin="round">
    <rect x="0" y="8" width="40" height="26" rx="4"/>
    <rect x="4" y="12" width="5" height="5" rx="0.8"/>
    <rect x="11" y="12" width="5" height="5" rx="0.8"/>
    <rect x="18" y="12" width="5" height="5" rx="0.8"/>
    <rect x="25" y="12" width="5" height="5" rx="0.8"/>
    <rect x="32" y="12" width="4" height="5" rx="0.8"/>
    <rect x="8" y="25" width="24" height="4" rx="1"/>
  </g>
  <text x="532" y="36" class="kicker">AJUSTES  &#183;  PRIVACIDADE E SEGURAN&#199;A</text>
  <text x="532" y="60" class="title">Monitoramento de Entrada</text>
  <text x="480" y="108" class="sub">&#201; o que faz os atalhos funcionarem</text>
  <text x="480" y="128" class="sub">mesmo com outro app na frente.</text>
  <text x="480" y="152" class="sub">Sem isto, o atalho parece n&#227;o fazer nada.</text>
</svg>
