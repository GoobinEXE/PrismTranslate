<svg xmlns="http://www.w3.org/2000/svg" width="880" height="128" viewBox="0 0 880 128" role="img" aria-labelledby="title desc">
  <title id="title">Onde o Prism aparece</title>
  <desc id="desc">Depois de abrir, o Prisma fica à direita da barra de menus, no topo da tela.</desc>
  <defs>
    <style>
      .label { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6A645C; }
      .call { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1C1B19; }
    </style>
  </defs>

  <rect x="0.5" y="16.5" width="879" height="111" rx="18" fill="#F6F3EC" stroke="#E3DDD2"/>

  <!-- Menu bar chrome -->
  <rect x="24" y="36" width="832" height="36" rx="8" fill="#2A2926"/>
  <text x="40" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F6F3EC">Finder</text>
  <text x="96" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C5C0B8">Arquivo  Editar  Visualizar</text>
  <text x="760" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#C5C0B8">Wi-Fi   21:00</text>

  <!-- Prism in the menu bar -->
  <rect x="700" y="40" width="28" height="28" rx="6" fill="#3F3D3A"/>
  <g transform="translate(706, 46)" fill="none" stroke="#F6F3EC" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 1.4 L2.2 13.1 L10.6 13.1 Z"/>
    <path d="M7 1.4 L12.2 8.7 L10.6 13.1"/>
    <path d="M0 7.5 L4.2 8.1"/>
    <path d="M10.9 8.1 L15.5 4.5 M10.9 8.1 L15.5 8.1 M10.9 8.1 L15.5 11.8"/>
  </g>

  <path d="M714 76 L714 90" stroke="#1C1B19" stroke-width="1.4"/>
  <path d="M708 84 L714 90 L720 84" fill="none" stroke="#1C1B19" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="112" class="call">O ícone fica aqui, no canto direito</text>
