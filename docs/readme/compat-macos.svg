<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img" aria-labelledby="title desc">
  <title id="title">Compatibilidade</title>
  <desc id="desc">Prism Translate esta disponivel no Mac, com macOS 15 Sequoia ou mais novo. Windows em desenvolvimento. iPad nos planos, sem prazo.</desc>
  <defs>
    <style>
      .card { fill: #F6F3EC; stroke: #E3DDD2; }
      .title { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1C1B19; }
      .sub { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6A645C; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="280" height="167" rx="18" class="card"/>
  <g transform="translate(28, 28)">
    <rect x="8" y="0" width="72" height="46" rx="5" fill="#2A2926"/>
    <rect x="13" y="5" width="62" height="36" rx="2.5" fill="#EEF3F8"/>
    <polygon points="44,12 36,28 52,28" fill="none" stroke="#3B6FD4" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M36 20 L32 22" stroke="#C9C4BA" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M52 20 L60 16 M52 20 L61 20 M52 20 L60 24" stroke="#E24A3B" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M52 20 L61 20" stroke="#4CAF6A" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="0" y="48" width="88" height="7" rx="2" fill="#2A2926"/>
    <rect x="28" y="51.5" width="32" height="2" rx="1" fill="#5C5854"/>
  </g>
  <text x="28" y="112" class="title">Dispon&#237;vel no Mac</text>
  <text x="28" y="134" class="sub">App da barra de menus do macOS.</text>

  <rect x="300.5" y="0.5" width="280" height="167" rx="18" class="card"/>
  <g transform="translate(328, 32)">
    <rect x="0" y="0" width="88" height="44" rx="10" fill="#1C1B19"/>
    <text x="44" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F6F3EC">15+</text>
  </g>
  <text x="328" y="112" class="title">macOS 15 Sequoia</text>
  <text x="328" y="134" class="sub">Ou qualquer vers&#227;o mais nova.</text>

  <rect x="600.5" y="0.5" width="279" height="167" rx="18" class="card"/>
  <g transform="translate(636, 28)" fill="none" stroke="#8A837A" stroke-width="1.6" stroke-linejoin="round">
    <!-- Windows: janela -->
    <rect x="0" y="10" width="44" height="32" rx="3"/>
    <path d="M0 18 H44"/>
    <circle cx="6" cy="14" r="1.3" fill="#8A837A" stroke="none"/>
    <circle cx="11" cy="14" r="1.3" fill="#8A837A" stroke="none"/>
    <text x="22" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8A837A">Windows</text>
    <!-- iPad -->
    <rect x="68" y="4" width="36" height="46" rx="5"/>
    <circle cx="86" cy="45" r="1.5" fill="#8A837A" stroke="none"/>
    <text x="86" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8A837A">iPad</text>
  </g>
  <text x="628" y="118" class="title">Ainda n&#227;o d&#225; para usar</text>
  <text x="628" y="138" class="sub">Windows: em desenvolvimento.</text>
  <text x="628" y="156" class="sub">iPad: nos planos, sem prazo.</text>
</svg>
